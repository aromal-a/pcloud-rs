# **PLATFORM MATRIX:**
# - Linux: full support (tier 1)
# - macOS / Windows: tier 1 native CI targets.
# - FreeBSD / NetBSD / OpenBSD / DragonFly BSD: native CI targets.
# - illumos / Solaris: native portability gates for CLI/API operation.

[package]
name = "pcloud-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Command-line client (pcloudc) for pcloud-rs that talks to the local daemon over secure IPC."
build = "build.rs"

[dependencies]
base64 = "0.22"
pcloud-config = { path = "../pcloud-config" }
pcloud-ipc = { path = "../pcloud-ipc" }
pcloud-model = { path = "../pcloud-model" }
pcloud-secret = { path = "../pcloud-secret" }
pcloud-store = { path = "../pcloud-store" }
rpassword = { workspace = true }
libc = "0.2"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
clap_complete = "4.6"
# Used by the `migrate-from-c` subcommand to read the legacy C client's
# `.pclouddb` SQLite file. Must stay pinned to the same version
# pcloud-store uses so both crates link a single bundled libsqlite3.
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

# Short installable binary name (`pcloudc`) while keeping the crate's
# library/test identity as `pcloud_cli`.
[[bin]]
name = "pcloudc"
path = "src/main.rs"

[lints]
workspace = true
