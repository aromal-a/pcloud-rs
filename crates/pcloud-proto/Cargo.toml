[package]
name = "pcloud-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Typed pCloud protocol clients (auth, transfer, shares, public links) over TLS."

[dependencies]
base64 = "0.22"
log = "0.4"
pcloud-config = { path = "../pcloud-config" }
pcloud-model = { path = "../pcloud-model" }
pcloud-resilience = { path = "../pcloud-resilience" }
pcloud-secret = { path = "../pcloud-secret" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde.workspace = true
sha1 = "0.10"
sha2 = { workspace = true }
thiserror.workspace = true
webpki-roots = "1.0"
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
arbitrary = { version = "1", features = ["derive"] }
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
pcloud-ipc = { path = "../pcloud-ipc" }
proptest = "1.5"
serde_json.workspace = true

[[bench]]
name = "proto_dispatch"
harness = false

[lints]
workspace = true
