[package]
name = "pcloud-live-e2e"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Live (gated) end-to-end verification harness for the pcloud-rs Rust rewrite. All tests are #[ignore]d unless PCLOUD_LIVE_E2E=1."

# This crate intentionally ships no library or binary surface: it only
# contributes integration tests that exercise the real pCloud backend when
# explicitly opted-in via environment variables. See README.md.
[lib]
path = "src/lib.rs"

[features]
# Default-disabled feature gate. Even when the feature is enabled the tests
# still honour the PCLOUD_LIVE_E2E=1 runtime gate, so a plain
# `cargo check --workspace --all-features` cannot accidentally hit the API.
default = []
live = []

[dependencies]

[dev-dependencies]
pcloud-auth = { path = "../pcloud-auth" }
pcloud-config = { path = "../pcloud-config" }
pcloud-daemon = { path = "../pcloud-daemon" }
pcloud-fleet = { path = "../pcloud-fleet" }
pcloud-ipc = { path = "../pcloud-ipc" }
pcloud-model = { path = "../pcloud-model" }
pcloud-embedded-sdk = { path = "../pcloud-sdk" }
pcloud-secret = { path = "../pcloud-secret" }
# CLAUDEREV deferred-set D2.1 (fire 46): the marker-file recovery layer in
# `tests/common/mod.rs` derives Serialize/Deserialize on AcpRotationMarker
# so a JSON round-trip survives a crashed test process.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
