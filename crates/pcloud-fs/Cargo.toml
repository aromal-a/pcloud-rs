# **PLATFORM MATRIX:**
# - Linux: full support (tier 1) — FUSE via `fuser`.
# - FreeBSD / NetBSD / OpenBSD / DragonFlyBSD: native FUSE support.
# - macOS: fuse-t via direct C FFI; strict native live gate.
# - Windows: WinFSP via direct C FFI; strict native live gate.
# - illumos / Solaris / other Unix: portable API/CLI, explicit unsupported mount.

[package]
name = "pcloud-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Cross-platform mounted-drive integration, staging, and crash-safe writeback for pcloud-rs."

[dependencies]
pcloud-cache = { path = "../pcloud-cache" }
pcloud-engine = { path = "../pcloud-engine" }
pcloud-model = { path = "../pcloud-model" }
pcloud-observability = { path = "../pcloud-observability", features = ["prometheus-exporter"] }
pcloud-proto = { path = "../pcloud-proto" }
pcloud-resilience = { path = "../pcloud-resilience" }
pcloud-secret = { path = "../pcloud-secret" }
glob = "0.3"
indexmap.workspace = true
log = "0.4"
lru.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# libc is needed on every Unix target (Linux, macOS, FreeBSD, NetBSD, ...)
# for `geteuid` in the staging-dir ownership check (audit-04 P2-4b).
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser.workspace = true

[target.'cfg(any(target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
# fuser's non-Linux build requires the native libfuse-compatible ABI
# (fusefs on FreeBSD/OpenBSD, refuse on NetBSD).
fuser = { workspace = true, features = ["libfuse"] }

[target.'cfg(target_os = "macos")'.dependencies]
# NOTE: fuse-t binding is via direct C FFI in pcloud-fs/src/platform/macos_ffi.rs,
# not a separate crate. A labelled native runner owns the strict live gate.
# libc is pulled in by the broader `cfg(unix)` stanza above.

[target.'cfg(windows)'.dependencies]
# WinFSP adapter via hand-rolled FFI.
# We deliberately do NOT depend on the third-party `winfsp` crate; see
# `src/platform/winfsp_ffi.rs` for rationale (auditable unsafe surface,
# graceful DLL-missing handling, secret-handling discipline).
libc = { workspace = true }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # Required by `platform/windows.rs::build_current_user_security_descriptor`
    # (SDDL synthesis via ConvertSidToStringSidW +
    # ConvertStringSecurityDescriptorToSecurityDescriptorW) and by the
    # Windows reaper's `SetConsoleCtrlHandler` path. Previously these
    # were only reachable via workspace-level feature unification from
    # `pcloud-ipc`; cargo check -p pcloud-fs in isolation (e.g. from
    # `winfsp_mount_live` integration test) fails without them.
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "page_cache"
harness = false

[[bench]]
name = "chunked_flush"
harness = false

[[bench]]
name = "writeback_flush"
harness = false

[lints]
workspace = true
