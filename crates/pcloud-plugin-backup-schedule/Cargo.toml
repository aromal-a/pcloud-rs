[package]
name = "pcloud-plugin-backup-schedule"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "User-level cron scheduler plugin that triggers backup sync cycles on a time-tick driven schedule. Supports native cron syntax and a small natural-language DSL."

[dependencies]
pcloud-plugin-api = { path = "../pcloud-plugin-api" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
cron = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[lints]
workspace = true
