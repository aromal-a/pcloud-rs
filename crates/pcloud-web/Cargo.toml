[package]
name = "pcloud-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "MVP Web UI scaffold for the pcloud-rs daemon (P4.5). Axum-based HTTP surface with loopback defaults and IPC-backed status views. Not the final Leptos SSR app."

[dependencies]
axum = { version = "0.7", features = ["form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower = "0.5"
pcloud-ipc = { path = "../pcloud-ipc" }
pcloud-model = { path = "../pcloud-model" }
pcloud-secret = { path = "../pcloud-secret" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true
subtle.workspace = true
zeroize.workspace = true
log.workspace = true
libc.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tempfile = "3"

[lints]
workspace = true
