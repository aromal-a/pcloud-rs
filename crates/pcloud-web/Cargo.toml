[package]
name = "pcloud-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MVP Web UI scaffold for the pcloud-rs daemon (P4.5). Axum-based localhost-only HTTP surface; read-only status views wired through the IPC client. Not the final Leptos SSR app."

[dependencies]
axum = { version = "0.7", features = ["form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower = "0.5"
pcloud-ipc = { path = "../pcloud-ipc" }
pcloud-model = { path = "../pcloud-model" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }

[lints]
workspace = true
