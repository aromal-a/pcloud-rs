[package]
name = "pcloud-resilience"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Enterprise resilience primitives (rate limiter, circuit breaker, retry, timeout) for pcloud-rs."

[features]
default = ["transport-metrics"]
# Tokio-backed `Timeout` helper. Off by default so the core primitives stay
# runtime-agnostic and this crate remains a pure utility library.
tokio-timeout = ["dep:tokio"]
# Wire transport metrics (latency histogram + error counter) to pcloud-observability.
# Enables the `prometheus-exporter` feature of `pcloud-observability` so that
# `register_histogram`, `HistogramHandle`, and `DEFAULT_LATENCY_BUCKETS` are
# available on the module path used inside `transport.rs`.
transport-metrics = ["dep:pcloud-observability", "pcloud-observability/prometheus-exporter"]

[dependencies]
thiserror.workspace = true
parking_lot = "0.12"
tokio = { version = "1", features = ["time", "macros", "rt"], optional = true }
pcloud-observability = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["time", "macros", "rt", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
