[package]
name = "pcloud-resilience"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Enterprise resilience primitives (rate limiter, circuit breaker, retry, timeout) for pcloud-rs."

[features]
default = []
# Tokio-backed `Timeout` helper. Off by default so the core primitives stay
# runtime-agnostic and this crate remains a pure utility library.
tokio-timeout = ["dep:tokio"]

[dependencies]
thiserror.workspace = true
parking_lot = "0.12"
tokio = { version = "1", features = ["time", "macros", "rt"], optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["time", "macros", "rt", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
