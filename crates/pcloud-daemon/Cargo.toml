# **PLATFORM MATRIX:**
# - Linux: full support (tier 1)
# - FreeBSD: tier 2 (most deps work)
# - macOS: tier 1 planned — see PLAN_CROSSPLATFORM.md §3.4 (Keychain vault via security-framework)
# - Windows: tier 1 planned — see PLAN_CROSSPLATFORM.md §3.5 (Service + DPAPI vault)

[package]
name = "pcloud-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Long-running pcloud-rs daemon (pcloudd): runtime orchestration, backends, IPC server, vault."

[features]
# Observability add-on. Default OFF for the minimal daemon build. Enables
# the full Prometheus metric families on the observability shell and
# populates the Prometheus snapshot inside `Method::Health`. Structured
# JSON logs are controlled by `json-logs` which forwards to the
# observability crate's feature of the same name.
default = []
metrics = ["pcloud-observability/prometheus-exporter"]
json-logs = ["pcloud-observability/json-logs"]
# OpenTelemetry distributed tracing. When enabled, `dispatch::handle_request`
# parses an inbound W3C `traceparent`, opens `pcloudd.dispatch` and per-backend
# child spans, and forwards every attribute through `attr_redact` so PII keys
# can never escape into the OTLP exporter. Off by default; opt in via
# `--features tracing-otlp` for both daemon and observability crates.
tracing-otlp = [
    "pcloud-observability/tracing-otlp",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
]

[dependencies]
anyhow = "1"
# Stage 4b.3: base64-encode sealed priv/pub_key_ver1 blobs for the
# `crypto_setuserkeys` (PclsyncCompat) IPC dispatch path.
base64 = "0.22"
pcloud-auth = { path = "../pcloud-auth" }
pcloud-backends = { path = "../pcloud-backends" }
pcloud-session = { path = "../pcloud-session" }
pcloud-cache = { path = "../pcloud-cache" }
pcloud-config = { path = "../pcloud-config" }
pcloud-crypto = { path = "../pcloud-crypto" }
pcloud-engine = { path = "../pcloud-engine" }
pcloud-fs = { path = "../pcloud-fs" }
pcloud-ipc = { path = "../pcloud-ipc" }
pcloud-model = { path = "../pcloud-model" }
pcloud-observability = { path = "../pcloud-observability" }
pcloud-p2p = { path = "../pcloud-p2p" }
pcloud-proto = { path = "../pcloud-proto" }
pcloud-resilience = { path = "../pcloud-resilience" }
pcloud-secret = { path = "../pcloud-secret" }
pcloud-store = { path = "../pcloud-store" }
libc.workspace = true
log.workspace = true
# Tier-2 HA: safe cross-platform `flock` wrapper used by
# `ha_lease::LeaseHolder`. Public API is safe so the new module keeps
# `#![forbid(unsafe_code)]`.
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize = "1.8"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["registry", "fmt"] }
tracing-opentelemetry = { version = "0.25", optional = true }
opentelemetry = { version = "0.24", optional = true }
# Required by `integrity_sweeper_service::skip_globs` — compile-time
# pattern matching for sweeper exclude lists. Not gated by any feature.
glob = "0.3"
# Cron expression parser backing the sweeper `schedule_cron` field.
cron.workspace = true
chrono.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"  # Keychain-backed auth vault
# core-foundation = "0.9"
# `battery` is the cross-platform notebook-battery-state crate used by
# the integrity-sweeper `pause_on_battery` hook. Linux reads
# `/sys/class/power_supply/` directly, so `battery` is only pulled in on
# macOS / Windows to keep Linux build closure minimal.
battery.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
# Planned (bd-xplat-windows):
# windows-service = "0.7"
battery.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
proptest = "1.5"
tempfile = "3"

# Produce a short installable binary name (`pcloudd`) while keeping the
# crate's library/test identity (`pcloud_daemon`) unchanged so downstream
# crates can still depend on it.
[[bin]]
name = "pcloudd"
path = "src/main.rs"

[[bench]]
name = "sync_root_canonicalize"
harness = false

[[bench]]
name = "vault_open_close"
harness = false

[lints]
workspace = true

# ── Distribution packaging metadata ───────────────────────────────────────
#
# These blocks are consumed by `cargo-deb` and `cargo-generate-rpm` to
# produce platform-native packages from a release build. They are wired
# into `.github/workflows/release-packaging.yml`, which runs on `v*.*.*`
# tag pushes (Stream G — packaging CI). The historical `nfpm.yaml` /
# `cargo-deb.toml` snippets under `packaging/debian/` remain in tree as
# alternative recipes; the canonical CI path is the metadata blocks below.
#
# Both blocks ship the daemon (`pcloudd`) AND the CLI (`pcloudc`) because
# end users need the CLI to drive the daemon (see release.yml comments
# under pcloud-rs-ncx.26 / audit-06 P2-12). The CLI binary is produced
# from the `pcloud-cli` crate; package builders must build that crate
# alongside the daemon (`cargo build --release -p pcloud-daemon -p pcloud-cli`).

[package.metadata.deb]
name = "pcloud-rs"
maintainer = "pcloud-rs maintainers <ezechiel203@gmail.com>"
copyright = "2026, pcloud-rs contributors"
license-file = ["../../LICENSE-MIT", "4"]
extended-description = """\
pCloud command-line client and user-space daemon (Rust rewrite). \
Provides the `pcloudc` CLI and the `pcloudd` background daemon for \
syncing, mounting, and managing pCloud accounts. This is the Rust \
rewrite of the historical C/C++ pcloudcc client; it ships hardened \
systemd integration, opt-in FUSE mount support, and an owner-only \
local IPC surface."""
section = "net"
priority = "optional"
# Mirror the dependency closure from packaging/debian/nfpm.yaml. `$auto`
# adds shared-library dependencies discovered via `dpkg-shlibdeps`. The
# explicit additions cover SQLite, TLS, FUSE3, and CA roots.
depends = "$auto, libc6, libssl3 | libssl1.1, libsqlite3-0, libfuse3-3, fuse3"
recommends = "ca-certificates"
assets = [
    ["target/release/pcloudd", "usr/bin/", "755"],
    ["target/release/pcloudc", "usr/bin/", "755"],
    ["../../packaging/systemd/pcloudd.service", "lib/systemd/system/", "644"],
    ["../../packaging/systemd/pcloudd.socket", "lib/systemd/system/", "644"],
    ["../../packaging/init/common/pcloudd.env.example", "etc/pcloud-rs/pcloudd.env.example", "644"],
    ["../../packaging/debian/pcloud-rs.logrotate", "etc/logrotate.d/pcloud-rs", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/pcloud-rs/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/pcloud-rs/LICENSE-APACHE", "644"],
    ["../../README.md", "usr/share/doc/pcloud-rs/README.md", "644"],
]
conf-files = [
    "/etc/pcloud-rs/pcloudd.env.example",
    "/etc/logrotate.d/pcloud-rs",
]
maintainer-scripts = "../../packaging/debian"

[package.metadata.generate-rpm]
name = "pcloud-rs"
summary = "pCloud command-line client and user-space daemon (Rust rewrite)"
license = "MIT OR Apache-2.0"
url = "https://github.com/ezechiel203/pcloud-rs"
# `cargo-generate-rpm` resolves Requires automatically from the staged
# binaries' dynamic-linker view via `--auto-req auto`. The explicit list
# below documents the expected runtime surface for distros without
# `find-requires`.
post_install_script = "../../packaging/debian/postinst"
post_uninstall_script = "../../packaging/debian/postrm"

[package.metadata.generate-rpm.requires]
sqlite-libs = "*"
openssl-libs = "*"
fuse3-libs = "*"

[[package.metadata.generate-rpm.assets]]
source = "target/release/pcloudd"
dest = "/usr/bin/pcloudd"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "target/release/pcloudc"
dest = "/usr/bin/pcloudc"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "packaging/systemd/pcloudd.service"
dest = "/lib/systemd/system/pcloudd.service"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/systemd/pcloudd.socket"
dest = "/lib/systemd/system/pcloudd.socket"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/init/common/pcloudd.env.example"
dest = "/etc/pcloud-rs/pcloudd.env.example"
mode = "0644"
config = true

[[package.metadata.generate-rpm.assets]]
source = "packaging/debian/pcloud-rs.logrotate"
dest = "/etc/logrotate.d/pcloud-rs"
mode = "0644"
config = true

[[package.metadata.generate-rpm.assets]]
source = "LICENSE-MIT"
dest = "/usr/share/doc/pcloud-rs/LICENSE-MIT"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "LICENSE-APACHE"
dest = "/usr/share/doc/pcloud-rs/LICENSE-APACHE"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/pcloud-rs/README.md"
mode = "0644"
doc = true
