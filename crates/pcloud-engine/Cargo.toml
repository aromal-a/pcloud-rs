[package]
name = "pcloud-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Sync engine primitives (diff planner, scheduler scaffolding) for pcloud-rs."

[dependencies]
pcloud-model = { path = "../pcloud-model" }
pcloud-resilience = { path = "../pcloud-resilience" }
pcloud-rsync = { path = "../pcloud-rsync" }
serde.workspace = true
globset = "0.4"
log.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
serde_json.workspace = true
tempfile = "3"

[[bench]]
name = "engine"
harness = false

[lints]
workspace = true
