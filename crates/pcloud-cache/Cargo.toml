[package]
name = "pcloud-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "In-memory caching primitives for pcloud-rs metadata and transfer state."

[dependencies]
parking_lot = "0.12"
# P5.1: we need the `rc` feature to (de)serialize `Arc<Vec<u8>>` inside the
# page cache. `rc` is additive and safe because entries are replaced, not
# shared identity-preserving, across serialize/deserialize round trips.
serde = { workspace = true, features = ["rc"] }
linked-hash-map = { version = "0.5", features = ["serde_impl"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
