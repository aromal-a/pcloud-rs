[package]
name = "pcloud-idp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Enterprise identity-provider (IdP) broker traits for federated login (OIDC, SAML, LDAP). Includes an OIDC Authorization Code + PKCE broker."

[features]
# HTTP-backed pCloud trusted-issuer exchanger. On by default so the
# daemon surface matches the default-on-in-docs posture; operators can
# strip the HTTP client dependency by building with
# `--no-default-features`.
default = ["oidc-http-exchange"]
oidc-http-exchange = []
# Test-only: permits `http://` exchange URLs outside of loopback. This
# feature is deliberately *not* exposed in any release build.
insecure-plaintext-exchange = []

[dependencies]
pcloud-secret = { path = "../pcloud-secret" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
jsonwebtoken = { version = "10", default-features = false }

[lints]
workspace = true
