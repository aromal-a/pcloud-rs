[package]
name = "pcloud-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Client-side crypto folder primitives (AES-256-GCM, Argon2, zeroized keys) for pcloud-rs."

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
base64 = "0.22"
getrandom.workspace = true
hmac.workspace = true
log.workspace = true
pbkdf2.workspace = true
pcloud-kms = { path = "../pcloud-kms" }
pcloud-secret = { path = "../pcloud-secret" }
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1"
zeroize.workspace = true

# pclsync-v2 wire-compat deps (gated). RSA-4096 + RSAES-OAEP-SHA1 mirror the
# mbedtls configuration used by the C client's pcryptofolder.c / pssl.c.
rsa = { workspace = true, optional = true }
getrandom4 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
static_assertions = { workspace = true, optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
ctr = { version = "0.9", optional = true }
cipher = { version = "0.4", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[features]
# OFF by default — enables legacy C-compat PBKDF2-HMAC-SHA-512 5000-iter
# password derivation for byte-equivalent interop with the legacy C client
# auth path. When disabled (the secure default) the OWASP 2023 iteration
# count is used instead (see password_scorer::PBKDF2_ITERS_OWASP).
legacy-c-compat = []
# Default feature set: activates pclsync-v2 so the PclsyncCompat backend
# dispatch is compiled into the default build (Wave 2 Stage 2).
default = ["pclsync-v2", "crypto-provider-rustcrypto"]
# Wave 1 pclsync-v2 rewrite gate. Enables primitives that mirror the legacy
# pclsync C wire format (PBKDF2-HMAC-SHA512 KEK derivation, RSA-OAEP wrapping,
# CBC-CS sector cipher, base32 filename encoding). OFF during Wave 1 so the
# existing Argon2/GCM path keeps building unchanged.
pclsync-v2 = ["dep:rsa", "dep:getrandom4", "dep:sha1", "dep:static_assertions", "dep:aes", "dep:cbc", "dep:cipher", "dep:rand_core", "dep:ctr"]
# Opt-in test-only helpers for downstream crates' integration tests.
# Exposes `PclsyncCompatState::for_test` and `SymKeyVer1::duplicate` as
# `#[doc(hidden)] pub` so sibling crates (e.g. pcloud-backends) can drive
# the RSA share-invitation wire path end-to-end under `cargo test`
# without routing through the full `unlock_profile` flow. This feature
# MUST NOT be enabled in production builds; it is dev-dependency-gated.
test-helpers = []

# ── Crypto provider seam (Stream G — forward-compat scaffolding) ─────────
#
# `crypto-provider-rustcrypto` selects the audited pure-Rust primitive
# stack (RustCrypto: aes-gcm, sha2, hmac, pbkdf2, argon2). This is the
# only provider currently wired and is what every test exercises. It is
# pulled in by the `default` feature set above so the existing build is
# unchanged.
#
# `crypto-provider-aws-lc-fips` is a FORWARD-COMPAT SEAM ONLY. It does
# NOT provide a FIPS-validated build today. Enabling it triggers a
# compile-time `compile_error!` (see `crates/pcloud-crypto/src/lib.rs`)
# that points at `docs/fips.md`, which documents the swap procedure
# (replace primitive crates, rebuild against an externally-validated
# module, re-vendor, and add a runtime-policy gate). No
# `CryptoPolicy::fips_mode` field is implemented today; the swap
# procedure in `docs/fips.md` introduces it. The feature exists so
# downstream operators have a stable cargo flag to wire CI against,
# and so a future PR can land the provider switch without breaking
# existing build invocations.
#
# Both features are mutually exclusive at compile time. Do not flip the
# default without a validated replacement and a CI gate.
crypto-provider-rustcrypto = []
crypto-provider-aws-lc-fips = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
hex-literal = "0.4"
proptest = "1.5"
serde_json.workspace = true

[[bench]]
name = "aead_sector"
harness = false

[lints]
workspace = true
