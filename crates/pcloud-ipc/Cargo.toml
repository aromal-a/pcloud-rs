# **PLATFORM MATRIX:**
# - Linux: full support (tier 1) — UNIX sockets + SO_PEERCRED peer checks.
# - BSD/macOS: AF_UNIX + getpeereid(3).
# - illumos/Solaris: AF_UNIX + getpeerucred(3).
# - Windows: named pipes + exact TokenUser SID checks.

[package]
name = "pcloud-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Peer-authenticated local IPC over Unix sockets or Windows named pipes."

[dependencies]
libc = "0.2"
log.workspace = true
pcloud-model = { version = "0.8.1-beta", path = "../pcloud-model" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
# bd-xplat-windows: Named Pipes + SID-based peer authentication.
# - Win32_System_Pipes:            CreateNamedPipeW / GetNamedPipeClientProcessId
# - Win32_Security:                TOKEN_USER / TokenUser / SID structures
# - Win32_Foundation:              HANDLE / CloseHandle / BOOL / LUID
# - Win32_Security_Authorization:  ConvertSidToStringSidW /
#                                  ConvertStringSecurityDescriptorToSecurityDescriptorW
# - Win32_System_Threading:        OpenProcessToken / OpenProcess / GetCurrentProcess
# - Win32_Storage_FileSystem:      FILE_FLAG_OVERLAPPED, PIPE_ACCESS_* constants
windows = { version = "0.58", features = [
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
zeroize = "1.8"

[[bench]]
name = "ipc_codec"
harness = false

[lints]
workspace = true
