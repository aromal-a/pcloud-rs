[package]
name = "pcloud-embedded-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Internal embedded-daemon compatibility API for pcloud-rs."

[lib]
name = "pcloud_embedded_sdk"

# The embedded compatibility transport is rustls + webpki-roots through
# pcloud-proto.
# Native TLS is intentionally outside the supported feature surface.

[features]
# pcloud-embedded-sdk has no optional deps today (§8:221 audit compliance).
# All deps are unconditional; the crate compiles correctly with no flags.
# Keeping an empty feature matrix avoids advertising unqualified variants.
default = []

[dependencies]
base64 = "0.22"
pcloud-config = { path = "../pcloud-config" }
pcloud-daemon = { path = "../pcloud-daemon" }
pcloud-error = { path = "../pcloud-error" }
pcloud-ipc = { path = "../pcloud-ipc" }
pcloud-model = { path = "../pcloud-model" }
pcloud-observability = { path = "../pcloud-observability" }
pcloud-plugin-api = { path = "../pcloud-plugin-api" }
pcloud-proto = { path = "../pcloud-proto" }
pcloud-secret = { path = "../pcloud-secret" }
pcloud-store = { path = "../pcloud-store" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
zeroize.workspace = true

[dev-dependencies]
proptest = "1"
tempfile = "3"
pcloud-backends = { path = "../pcloud-backends" }
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[example]]
name = "login_and_list"
path = "examples/login_and_list.rs"

[[example]]
name = "upload_and_download"
path = "examples/upload_and_download.rs"

[[example]]
name = "public_link"
path = "examples/public_link.rs"

[[example]]
name = "crypto_lifecycle"
path = "examples/crypto_lifecycle.rs"

[[example]]
name = "create_tree_public_link_from_paths"
path = "examples/create_tree_public_link_from_paths.rs"

[[bench]]
name = "upload_session"
harness = false

[lints]
workspace = true
