# Optional cargo-deb metadata snippet.
#
# This file is NOT auto-consumed by cargo-deb — cargo-deb reads
# `[package.metadata.deb]` in a crate's Cargo.toml. Because the CLAUDE.md
# rules forbid editing existing Cargo.toml files, this snippet is provided
# as a drop-in reference. If/when packaging via cargo-deb is desired,
# copy the block below into `crates/pcloud-cli/Cargo.toml` (and
# an analogous one into `pcloud-daemon/Cargo.toml`) in a dedicated PR.
#
# Preferred path: use nfpm.yaml in this same directory instead.

