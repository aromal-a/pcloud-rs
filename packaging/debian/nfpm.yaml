# nfpm configuration for pcloud-rs Debian/RPM packaging.
#
# Build (from repo root after `cargo build --release --workspace`):
#
#   # amd64 (default):
#   VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0-dev") \
#   nfpm pkg --config packaging/debian/nfpm.yaml --packager deb --target dist/
#
#   # arm64 — cross-compile first, then override arch:
#   cargo build --release --target aarch64-unknown-linux-gnu --workspace
#   VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0-dev") \
#   NFPM_ARCH=arm64 \
#   nfpm pkg --config packaging/debian/nfpm.yaml --packager deb --target dist/
#
#   # RPM:
#   VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0-dev") \
#   nfpm pkg --config packaging/debian/nfpm.yaml --packager rpm --target dist/
#
# Validate without building:
#   nfpm --config packaging/debian/nfpm.yaml check
#
# CI note: the .deb build is not yet wired into ci.yml (tracked pcloud-rs-s1p.69).
# To add it, run the amd64 build command above in a post-release workflow step
# and upload dist/*.deb as a release asset.

name: pcloud-rs
# arch is overridden at build time via NFPM_ARCH env var for cross-compiled targets.
# Supported values: amd64, arm64. Default: amd64.
arch: ${NFPM_ARCH:-amd64}
platform: linux
# version is sourced from the current git tag at build time.
# Set VERSION env var before invoking nfpm; see build commands above.
version: ${VERSION:-0.0.0-dev}
section: net
priority: optional
maintainer: "pcloud-rs maintainers <ezechiel203@gmail.com>"
description: |
  pCloud command-line client and user-space daemon (Rust rewrite).
  Provides the `pcloudc` CLI and the `pcloudd` background daemon
  for syncing, mounting, and managing pCloud accounts.
vendor: "pcloud-rs"
homepage: "https://github.com/ezechiel203/pcloud-rs"
license: "MIT OR Apache-2.0"

depends:
  - libc6
  - libssl3 | libssl1.1
  - libsqlite3-0
  - libfuse3-3
  - fuse3
recommends:
  - ca-certificates

contents:
  - src: ../../target/release/pcloudc
    dst: /usr/bin/pcloudc
    file_info:
      mode: 0755
  - src: ../../target/release/pcloudd
    dst: /usr/bin/pcloudd
    file_info:
      mode: 0755
  - src: ../systemd/pcloudd.service
    dst: /lib/systemd/system/pcloudd.service
    type: config|noreplace
    file_info:
      mode: 0644
  - src: ../man
    dst: /usr/share/man/man1
    type: tree
  - src: ../../LICENSE-MIT
    dst: /usr/share/doc/pcloud-rs/LICENSE-MIT
  - src: ../../LICENSE-APACHE
    dst: /usr/share/doc/pcloud-rs/LICENSE-APACHE

scripts:
  postinstall: ./postinst
  postremove: ./postrm

deb:
  compression: xz
  fields:
    Bugs: "https://github.com/ezechiel203/pcloud-rs/issues"
