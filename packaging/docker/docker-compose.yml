# Example compose file for the pcloud-rs Rust daemon.
#
#   docker compose -f packaging/docker/docker-compose.yml up -d
#
# Hardening defaults: read-only rootfs, non-root UID, no new privileges,
# dropped caps, persistent 0700 SQLite volume, owner-only IPC socket.
#
# Secrets MUST be supplied via `docker secret` (swarm) or a bind-mounted
# 0400 file for plain compose. Do NOT put credentials in `environment:`.

services:
  pcloudd:
    image: pcloud-rs:latest
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    container_name: pcloudd
    restart: unless-stopped

    # Non-root distroless UID. Must match volume ownership below.
    user: "65532:65532"

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=65532,gid=65532

    security_opt:
      - no-new-privileges:true
      - seccomp=default
      # Optional: - apparmor=pcloudd    (see ../apparmor/)
    cap_drop:
      - ALL

    # No published ports. Daemon is reachable over the IPC socket volume.
    networks:
      - pcloud-rs-egress

    volumes:
      # Persistent SQLite + auth vault. Must be 0700, owned by UID 65532.
      # Create with:
      #   sudo install -d -m 0700 -o 65532 -g 65532 ./state
      - type: bind
        source: ./state
        target: /var/lib/pcloud-rs
        bind:
          create_host_path: false
      # Runtime dir holds daemon.sock (0600). Keep on a dedicated volume
      # so host consumers can bind-mount read-only if needed.
      - type: volume
        source: pcloud-rs-run
        target: /run/pcloud-rs

    # --- Secrets ---
    # Preferred: docker secrets (swarm) or sops-decrypted bind mounts.
    secrets:
      - source: pcloud-rs-token
        target: pcloud-rs-token
        uid: "65532"
        gid: "65532"
        mode: 0400
    environment:
      # Path only — the token itself is never in the environment.
      PCLOUDRS_TOKEN_FILE: /run/secrets/pcloud-rs-token
      RUST_LOG: "info"

    # Resource limits (mirror systemd unit).
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.75"
    pids_limit: 256
    ulimits:
      nofile: 4096
      nproc: 256

    healthcheck:
      test: ["CMD", "/usr/local/bin/pcloudc", "--socket", "/run/pcloud-rs/daemon.sock", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pcloud-rs-run:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=65532,gid=65532,mode=0700"

networks:
  pcloud-rs-egress:
    driver: bridge

secrets:
  pcloud-rs-token:
    # Populate out-of-band. Example for plain compose:
    #   file: /etc/pcloud-rs/token  (root:root, 0400, decrypted at boot by sops/vault-agent)
    file: ./secrets/pcloud-rs-token
