name: Coverage

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Coverage floor (percent, integer). The build fails if total line coverage
  # drops below this value. Bump this in a one-line PR after a green baseline
  # run lands. The 2026-07-16 locked baseline measured 77.82% lines; the
  # documented release floor is 65%. The shared checker also enforces the
  # higher per-crate floors for security-sensitive crates.
  LINE_COVERAGE_FLOOR: "65"

jobs:
  coverage:
    name: Workspace coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: llvm-tools-preview
      - name: Install system deps (FUSE)
        run: sudo apt-get install -y fuse3 libfuse3-dev
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Generate lcov coverage
        run: |
          cargo llvm-cov \
            --workspace \
            --lcov \
            --output-path lcov.info \
            --ignore-filename-regex 'crates/(pcloud-mockserver|pcloud-chaos)'
      - name: Upload lcov.info artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 90
      - name: Enforce coverage floor
        run: ./scripts/coverage-check.sh lcov.info "${LINE_COVERAGE_FLOOR}"
