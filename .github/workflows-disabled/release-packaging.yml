name: Release Packaging

# Builds Linux packages plus signed Windows and macOS installers on version
# tags. Runs in addition to (NOT in place of) `release.yml`, which produces
# raw binaries, SBOMs, and cosign signatures.
#
# Stream G — Packaging CI (closes the audit gap recorded in
# .audit-fragments/11-deployment.md §5: ".deb build NOT wired into CI"
# and the lower-severity equivalent for .rpm.)
#
# The .deb produced here uses `cargo-deb` reading [package.metadata.deb]
# from crates/pcloud-daemon/Cargo.toml. The .rpm uses `cargo-generate-rpm`
# reading [package.metadata.generate-rpm] from the same manifest. The
# legacy nfpm.yaml recipe in packaging/debian/ remains in tree as an
# alternative path but is NOT exercised by this workflow.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to package (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}

permissions:
  contents: write   # required for `gh release upload`

jobs:
  package-gate:
    name: Package release candidate gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Validate tag checkout
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in
            v*) ;;
            *)
              echo "ERROR: release tag must start with 'v' (got '${RELEASE_TAG}')" >&2
              exit 1
              ;;
          esac
          git fetch --force --tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_SHA="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${TAG_SHA}" ]; then
            echo "ERROR: checked-out commit ${HEAD_SHA} does not match ${RELEASE_TAG} target ${TAG_SHA}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev

      - name: Install release audit tools
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.19.8 --locked
          cargo install mdbook --version 0.5.3 --no-default-features --locked

      - name: Validate release version, workflows, and shell assets
        run: |
          VERSION="${RELEASE_TAG#v}" scripts/check-versions.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          find . \
            -path './target' -prune -o \
            -path './docs/book/book' -prune -o \
            -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --locked --no-deps --document-private-items

      - name: mdbook build
        run: |
          ruby scripts/check-mdbook-links.rb
          mdbook build docs/book

      - name: Validate NAS package metadata and supervisor lifecycle
        run: packaging/nas/validate.sh

      - name: cargo audit
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071

      - name: cargo deny
        run: cargo deny --locked check

  linux-live-mount:
    name: Linux native FUSE release gate
    runs-on: [self-hosted, Linux, pcloud-fuse]
    needs: package-gate
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.1

      - name: Validate tag checkout and native FUSE prerequisites
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          command -v fusermount3
          test -c /dev/fuse
          test -r /dev/fuse
          test -w /dev/fuse

      - name: Strict native mount lifecycle and 2 GiB transfer gate
        shell: bash
        run: scripts/linux-release-mount-gate.sh

  build-packages:
    name: Build .deb and .rpm packages (Linux x86_64)
    runs-on: ubuntu-latest
    needs: [package-gate, linux-live-mount]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Validate tag checkout
        run: |
          set -euo pipefail
          git fetch --force --tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_SHA="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${TAG_SHA}" ]; then
            echo "ERROR: checked-out commit ${HEAD_SHA} does not match ${RELEASE_TAG} target ${TAG_SHA}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.96.1

      - name: Install system build deps
        # libfuse3-dev is needed by pcloud-fs at link time; the runtime
        # dependency is libfuse3-3 (declared in metadata.deb / metadata.generate-rpm).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse3 libfuse3-dev pkg-config libssl-dev rpm

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb --locked --version ^2
          cargo install cargo-generate-rpm --locked --version ^0.14

      - name: Determine version
        id: version
        run: |
          VERSION="${RELEASE_TAG}"
          # Strip a leading 'v' if present; cargo-deb accepts a bare semver.
          VERSION_BARE="${VERSION#v}"
          echo "version=${VERSION_BARE}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building packages for version ${VERSION_BARE} (tag ${VERSION})"

      - name: Build release binaries (daemon + CLI)
        # Reproducible-ish: pin SOURCE_DATE_EPOCH to the tag commit so the
        # binary timestamps match release.yml. cargo-deb / cargo-generate-rpm
        # consume target/release/{pcloudd,pcloudc} from this step.
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          cargo build --release --workspace --locked \
            -p pcloud-daemon -p pcloud-cli

      - name: Build .deb package
        run: |
          mkdir -p dist
          cargo deb \
            --no-build \
            --no-strip \
            --package pcloud-daemon \
            --output dist/pcloud-rs_${{ steps.version.outputs.version }}_amd64.deb
          ls -la dist/

      - name: Validate .deb metadata
        run: |
          dpkg-deb --info dist/pcloud-rs_${{ steps.version.outputs.version }}_amd64.deb
          dpkg-deb --contents dist/pcloud-rs_${{ steps.version.outputs.version }}_amd64.deb | head -40

      - name: Build .rpm package
        run: |
          cargo generate-rpm \
            --package crates/pcloud-daemon \
            --auto-req auto \
            --output dist/pcloud-rs-${{ steps.version.outputs.version }}-1.x86_64.rpm
          ls -la dist/

      - name: Validate .rpm metadata
        run: |
          rpm -qip dist/pcloud-rs-${{ steps.version.outputs.version }}-1.x86_64.rpm
          rpm -qlp dist/pcloud-rs-${{ steps.version.outputs.version }}-1.x86_64.rpm | head -40

      - name: Compute SHA-256 digests
        run: |
          cd dist
          sha256sum *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      # CLAUDEREV iter-1 DEPLOY-H-11.2 / fire 34: GPG-sign every artifact
      # (.deb, .rpm, SHA256SUMS) using the project release key so
      # downstream verifiers can prove tampering hasn't occurred between
      # the CI runner and the GitHub release page.
      #
      # Required secrets (configured in the repo's Settings → Secrets
      # and variables → Actions; see OPERATIONS-RUNBOOK.md "Release key
      # rotation" for the provisioning flow):
      #   - RELEASE_GPG_PRIVATE_KEY: ASCII-armored exported private key
      #   - RELEASE_GPG_PASSPHRASE:  passphrase that unlocks it
      #   - RELEASE_GPG_KEY_ID:      long key fingerprint or short id
      #
      # When any of those secrets is unset (e.g. on a fork or a dry-run
      # tag pushed by a contributor without release-key access), the
      # signing step prints a structured "skipping signing" message and
      # the workflow proceeds — the unsigned artifacts still upload so
      # the rest of the gate remains useful for testing the packaging
      # flow itself. The release-attach step below copes with either
      # outcome (signed or unsigned) by globbing `dist/*.sig` only when
      # the files exist.
      - name: Check for GPG signing secrets
        id: gpg-secrets
        env:
          KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          PASS: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          if [ -n "${KEY:-}" ] && [ -n "${PASS:-}" ] && [ -n "${ID:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "GPG signing secrets are configured; artifacts will be signed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: one or more of RELEASE_GPG_{PRIVATE_KEY,PASSPHRASE,KEY_ID} is unset."
            echo "         Skipping signing — unsigned artifacts will still upload."
            echo "         See OPERATIONS-RUNBOOK.md 'Release key rotation' for the secret-provisioning flow."
          fi

      - name: Import GPG release key
        if: steps.gpg-secrets.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Import into a per-job ephemeral keyring under $RUNNER_TEMP so
          # nothing persists after the runner is torn down.
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Persist GNUPGHOME for subsequent steps.
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Sign artifacts (.deb, .rpm, SHA256SUMS)
        if: steps.gpg-secrets.outputs.available == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          cd dist
          for artifact in *.deb *.rpm SHA256SUMS; do
            # Detached, ASCII-armored signature with the explicit key id
            # so a multi-key keyring cannot pick the wrong subkey. The
            # passphrase is fed via --passphrase-fd to keep it off argv.
            echo "$GPG_PASSPHRASE" | gpg \
              --batch --yes \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              --local-user "$GPG_KEY_ID" \
              --detach-sign --armor \
              --output "${artifact}.sig" \
              "${artifact}"
            echo "Signed ${artifact} → ${artifact}.sig"
          done
          # Verify each signature against the imported public key as a
          # belt-and-suspenders check that the signing actually worked.
          for sig in *.sig; do
            gpg --verify "$sig" "${sig%.sig}"
          done
          ls -la *.sig

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.sig
            dist/SHA256SUMS

      - name: Attach packages to GitHub release
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Glob `*.sig` separately so the upload still works when
          # signing was skipped (no .sig files produced).
          UPLOADS=(dist/*.deb dist/*.rpm dist/SHA256SUMS)
          shopt -s nullglob
          SIG_FILES=(dist/*.sig)
          shopt -u nullglob
          if [ ${#SIG_FILES[@]} -gt 0 ]; then
            UPLOADS+=("${SIG_FILES[@]}")
          fi
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${UPLOADS[@]}" \
            --clobber

  nas-package-candidates:
    name: Tier-2 NAS candidates (${{ matrix.nas_arch }})
    runs-on: ubuntu-latest
    needs: [package-gate, linux-live-mount]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-musl
            nas_arch: x86_64
            synology_arch: x86_64
            qnap_arch: x86_64
            asustor_arch: x86-64
          - rust_target: aarch64-unknown-linux-musl
            nas_arch: arm64
            synology_arch: armv8
            qnap_arch: arm_64
            asustor_arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.1

      - name: Validate release tag and version
        run: |
          set -euo pipefail
          git fetch --force --tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          VERSION="${RELEASE_TAG#v}"
          WORKSPACE_VERSION="$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pcloud-cli"))')"
          test "$VERSION" = "$WORKSPACE_VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install pinned cross compiler driver
        run: cargo install cross --locked --version 0.2.5

      - name: Build static NAS binaries
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          cross build --profile release-dist --locked \
            --target "${{ matrix.rust_target }}" \
            -p pcloud-daemon -p pcloud-cli
          BIN_DIR="target/${{ matrix.rust_target }}/release-dist"
          file "$BIN_DIR/pcloudd" "$BIN_DIR/pcloudc"
          if readelf -l "$BIN_DIR/pcloudd" | grep -q 'Requesting program interpreter'; then
            echo 'NAS pcloudd unexpectedly has a dynamic ELF interpreter' >&2
            exit 1
          fi
          if readelf -l "$BIN_DIR/pcloudc" | grep -q 'Requesting program interpreter'; then
            echo 'NAS pcloudc unexpectedly has a dynamic ELF interpreter' >&2
            exit 1
          fi

      - name: Build and inspect Synology DSM 7 SPK
        run: |
          set -euo pipefail
          BIN_DIR="target/${{ matrix.rust_target }}/release-dist"
          packaging/nas/synology/build-spk.sh \
            --version "$VERSION" \
            --arch "${{ matrix.synology_arch }}" \
            --pcloudd "$BIN_DIR/pcloudd" \
            --pcloudc "$BIN_DIR/pcloudc" \
            --output dist/nas
          SPK="$(find dist/nas -maxdepth 1 -name '*.spk' -print -quit)"
          test -n "$SPK"
          tar -tf "$SPK"

      - name: Install checksum-pinned official QDK 2.5.3
        run: |
          set -euo pipefail
          QDK_DEB="$RUNNER_TEMP/qdk_2.5.3_amd64.deb"
          curl --fail --show-error --location \
            https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb \
            --output "$QDK_DEB"
          echo '17b3841b7d4590a4ee025844ba583304b5e3c497d9fa8934d5175131d3908022  '"$QDK_DEB" | sha256sum --check
          sudo apt-get update
          sudo apt-get install -y "$QDK_DEB"
          qbuild --version

      - name: Build and inspect QNAP QPKG
        run: |
          set -euo pipefail
          BIN_DIR="target/${{ matrix.rust_target }}/release-dist"
          packaging/nas/qnap/build-qpkg.sh \
            --version "$VERSION" \
            --arch "${{ matrix.qnap_arch }}" \
            --pcloudd "$BIN_DIR/pcloudd" \
            --pcloudc "$BIN_DIR/pcloudc" \
            --output dist/nas
          QPKG="$(find dist/nas -maxdepth 1 -name '*.qpkg' -print -quit)"
          test -n "$QPKG"
          mkdir -p dist/qnap-inspect
          qbuild --extract "$QPKG" dist/qnap-inspect
          find dist/qnap-inspect -maxdepth 3 -type f -print

      - name: Install checksum-pinned official ASUSTOR APKG 2.0 utility
        run: |
          set -euo pipefail
          APKG_ZIP="$RUNNER_TEMP/APKG_Utilities_2.0_0517.zip"
          curl --fail --show-error --location \
            https://downloadgb.asustor.com/developer/APKG_Utilities_2.0_0517.zip \
            --output "$APKG_ZIP"
          echo '71c77ab5cc2cecfc9afd0efbc77a47ce511148e60a8b1f8c20ab8df4ffe235ea  '"$APKG_ZIP" | sha256sum --check
          unzip -q "$APKG_ZIP" -d "$RUNNER_TEMP/asustor-apkg-tool"
          sudo install -m 755 \
            "$RUNNER_TEMP/asustor-apkg-tool/apkg-tools_py3.py" \
            /usr/local/bin/apkg-tool.py
          apkg-tool.py --help

      - name: Build and inspect ASUSTOR ADM 5 APKG
        run: |
          set -euo pipefail
          BIN_DIR="target/${{ matrix.rust_target }}/release-dist"
          sudo env APKG_TOOL=/usr/local/bin/apkg-tool.py \
            packaging/nas/asustor/build-apk.sh \
              --version "$VERSION" \
              --arch "${{ matrix.asustor_arch }}" \
              --pcloudd "$BIN_DIR/pcloudd" \
              --pcloudc "$BIN_DIR/pcloudc" \
              --output dist/nas
          APK="$(find dist/nas -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist/asustor-inspect
          apkg-tool.py extract "$APK" --destination dist/asustor-inspect
          find dist/asustor-inspect -maxdepth 4 -type f -print
          find dist/asustor-inspect -path '*/CONTROL/icon.png' -exec \
            python3 -c 'import struct,sys; p=open(sys.argv[1], "rb").read(24); assert p[:8] == b"\x89PNG\r\n\x1a\n" and struct.unpack(">II", p[16:24]) == (90, 90)' {} \;

      - name: Compute NAS candidate checksums
        run: |
          cd dist/nas
          sha256sum *.spk *.qpkg *.apk > "SHA256SUMS.${{ matrix.nas_arch }}.txt"
          cat "SHA256SUMS.${{ matrix.nas_arch }}.txt"

      # Deliberately not attached to the public GitHub release: these become
      # supported artifacts only after the native-appliance qualification
      # matrix in packaging/nas/README.md has passed.
      - uses: actions/upload-artifact@v4
        with:
          name: nas-tier2-candidates-${{ matrix.nas_arch }}
          path: |
            dist/nas/*.spk
            dist/nas/*.qpkg
            dist/nas/*.apk
            dist/nas/SHA256SUMS.*.txt

  windows-installer:
    name: Signed Windows x64 installer
    runs-on: windows-latest
    needs: [package-gate, linux-live-mount]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.1

      - name: Validate tag checkout and manifest version
        shell: pwsh
        run: |
          git fetch --force --tags origin "refs/tags/${env:RELEASE_TAG}:refs/tags/${env:RELEASE_TAG}"
          $tagSha = git rev-list -n 1 "refs/tags/${env:RELEASE_TAG}"
          $headSha = git rev-parse HEAD
          if ($headSha -ne $tagSha) {
            throw "Checked-out commit $headSha does not match ${env:RELEASE_TAG} target $tagSha"
          }
          $version = ($env:RELEASE_TAG).TrimStart('v')
          $manifest = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $workspaceVersion = ($manifest.packages | Where-Object { $_.name -eq 'pcloud-cli' }).version
          if ($version -ne $workspaceVersion) {
            throw "Tag version $version does not match workspace version $workspaceVersion"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Require Windows signing credentials
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw 'Public Windows releases require WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'pcloud-release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "PCLOUD_SIGNING_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Locate WiX v3 tools
        shell: pwsh
        run: |
          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $candle) {
            $candle = Get-ChildItem -ErrorAction SilentlyContinue `
              "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $candle) { throw 'WiX Toolset v3 was not found on the release runner.' }
          $wixBin = Split-Path $candle
          "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build and sign Rust executables
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          cargo build --release --locked -p pcloud-cli -p pcloud-daemon
          New-Item -ItemType Directory -Force dist\stage | Out-Null
          Copy-Item target\release\pcloudc.exe dist\stage\pcloudc.exe
          Copy-Item target\release\pcloudd.exe dist\stage\pcloudd.exe
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          foreach ($binary in Get-ChildItem dist\stage\*.exe) {
            pwsh -File packaging\signing\sign-windows.ps1 `
              -BinaryPath $binary.FullName `
              -PfxPath $env:PCLOUD_SIGNING_PFX `
              -PfxPassword $password
          }

      - name: Download and verify official WinFSP
        shell: pwsh
        run: |
          $vendor = New-Item -ItemType Directory -Force dist\vendor
          $msi = Join-Path $vendor.FullName 'winfsp-2.1.25156.msi'
          Invoke-WebRequest `
            -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' `
            -OutFile $msi
          $expected = '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A'
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash
          if ($actual -ne $expected) { throw "WinFSP checksum mismatch: $actual" }
          $signtool = (Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool verify /pa /v $msi
          if ($LASTEXITCODE -ne 0) { throw 'The official WinFSP MSI signature is invalid.' }

      - name: Build and sign pcloud-rs MSI
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          candle.exe -nologo -wx `
            -dStageDir="dist\stage" `
            -dProductVersion=$env:VERSION `
            -out "dist\pcloud-rs.wixobj" `
            "packaging\windows\wix\pcloud-rs.wxs"
          if ($LASTEXITCODE -ne 0) { throw 'candle failed.' }
          light.exe -nologo -wx -ext WixUIExtension `
            -b "packaging\windows\wix" `
            -out "dist\pcloud-rs-$env:VERSION-x64.msi" `
            "dist\pcloud-rs.wixobj"
          if ($LASTEXITCODE -ne 0) { throw 'light failed.' }
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          pwsh -File packaging\signing\sign-windows.ps1 `
            -BinaryPath "dist\pcloud-rs-$env:VERSION-x64.msi" `
            -PfxPath $env:PCLOUD_SIGNING_PFX `
            -PfxPassword $password

      - name: Build and sign public WinFSP bundle
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $msi = (Resolve-Path "dist\pcloud-rs-$env:VERSION-x64.msi").Path
          $winfsp = (Resolve-Path 'dist\vendor\winfsp-2.1.25156.msi').Path
          candle.exe -nologo -wx -ext WixBalExtension `
            -dProductVersion=$env:VERSION `
            -dWinFspMsi="$winfsp" `
            -dPcloudMsi="$msi" `
            -out "dist\pcloud-rs-bundle.wixobj" `
            "packaging\windows\wix\pcloud-rs-bundle.wxs"
          if ($LASTEXITCODE -ne 0) { throw 'Burn candle failed.' }
          $bundle = "dist\pcloud-rs-$env:VERSION-x64-setup.exe"
          light.exe -nologo -wx -ext WixBalExtension `
            -out $bundle "dist\pcloud-rs-bundle.wixobj"
          if ($LASTEXITCODE -ne 0) { throw 'Burn light failed.' }

          insignia.exe -ib $bundle -o dist\burn-engine.exe
          if ($LASTEXITCODE -ne 0) { throw 'Burn engine detach failed.' }
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          pwsh -File packaging\signing\sign-windows.ps1 `
            -BinaryPath dist\burn-engine.exe `
            -PfxPath $env:PCLOUD_SIGNING_PFX `
            -PfxPassword $password
          insignia.exe -ab dist\burn-engine.exe $bundle -o dist\signed-setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Burn engine reattach failed.' }
          Move-Item -Force dist\signed-setup.exe $bundle
          pwsh -File packaging\signing\sign-windows.ps1 `
            -BinaryPath $bundle `
            -PfxPath $env:PCLOUD_SIGNING_PFX `
            -PfxPassword $password

      - name: Write checksums and remove signing key
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Get-ChildItem dist\pcloud-rs-*.msi,dist\pcloud-rs-*-setup.exe -ErrorAction SilentlyContinue |
              ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_).Hash.ToLower(), $_.Name } |
              Set-Content dist\SHA256SUMS.windows.txt
          }
          if ($env:PCLOUD_SIGNING_PFX -and (Test-Path $env:PCLOUD_SIGNING_PFX)) {
            Remove-Item -Force $env:PCLOUD_SIGNING_PFX
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed-installer
          path: |
            dist/pcloud-rs-*.msi
            dist/pcloud-rs-*-setup.exe
            dist/SHA256SUMS.windows.txt

      - name: Attach signed Windows installers to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:RELEASE_TAG `
            (Get-ChildItem dist\pcloud-rs-*.msi).FullName `
            (Get-ChildItem dist\pcloud-rs-*-setup.exe).FullName `
            (Resolve-Path dist\SHA256SUMS.windows.txt).Path `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release upload failed.' }

  macos-installer:
    name: Signed and notarized macOS installer with live mount gate
    runs-on: [self-hosted, macOS, pcloud-fuse-t]
    needs: [package-gate, linux-live-mount]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.1

      - name: Validate tag checkout and manifest version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          VERSION="${RELEASE_TAG#v}"
          WORKSPACE_VERSION="$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pcloud-cli"))')"
          test "$VERSION" = "$WORKSPACE_VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Require Apple release credentials
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for value in P12_BASE64 P12_PASSWORD APPLICATION_IDENTITY INSTALLER_IDENTITY \
            APPLE_ID_VALUE APPLE_PASSWORD_VALUE APPLE_TEAM_VALUE; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required macOS release secret is missing: $value" >&2
              exit 1
            fi
          done

      - name: Import Apple signing identities into an ephemeral keychain
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/pcloud-release-$$.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/pcloud-release-$$.p12"
          OLD_KEYCHAINS="$RUNNER_TEMP/pcloud-old-keychains-$$.txt"
          security list-keychains -d user > "$OLD_KEYCHAINS"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "MACOS_RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "MACOS_RELEASE_P12=$P12" >> "$GITHUB_ENV"
          echo "MACOS_OLD_KEYCHAINS=$OLD_KEYCHAINS" >> "$GITHUB_ENV"

      - name: Strict native fuse-t live mount gate
        shell: bash
        env:
          PCLOUD_FUSE_TEST: '1'
          PCLOUD_MACOS_FUSE_BACKEND: fuse-t
        run: |
          set -euo pipefail
          pkgutil --pkg-info io.fuse-t.pkg.core
          cargo test -p pcloud-fs --test macos_mount_live --locked \
            readdir_root_via_fuset -- --ignored --exact --nocapture
          cargo test -p pcloud-fs --test macos_mount_live --locked \
            write_create_fsync_via_fuset -- --ignored --exact --nocapture

      - name: Build, sign, notarize, and assess package
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          ./packaging/macos/build-pkg.sh \
            --application-sign "$APPLICATION_IDENTITY" \
            --installer-sign "$INSTALLER_IDENTITY" \
            --notarize
          PKG="$(find target/pkg -maxdepth 1 -name "pcloud-rs-${VERSION}-macos-*.pkg" -print -quit)"
          test -n "$PKG"
          pkgutil --check-signature "$PKG"
          spctl --assess --type install --verbose=4 "$PKG"
          shasum -a 256 "$PKG" > target/pkg/SHA256SUMS.macos.txt

      - name: Remove ephemeral Apple keychain
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${MACOS_OLD_KEYCHAINS:-}" && -f "$MACOS_OLD_KEYCHAINS" ]]; then
            old=()
            while IFS= read -r line; do
              line="${line#*\"}"
              line="${line%\"*}"
              [[ -n "$line" ]] && old+=("$line")
            done < "$MACOS_OLD_KEYCHAINS"
            if [[ ${#old[@]} -gt 0 ]]; then
              security list-keychains -d user -s "${old[@]}"
            fi
          fi
          [[ -n "${MACOS_RELEASE_KEYCHAIN:-}" ]] && security delete-keychain "$MACOS_RELEASE_KEYCHAIN"
          [[ -n "${MACOS_RELEASE_P12:-}" ]] && rm -f "$MACOS_RELEASE_P12"
          [[ -n "${MACOS_OLD_KEYCHAINS:-}" ]] && rm -f "$MACOS_OLD_KEYCHAINS"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-signed-notarized-installer
          path: |
            target/pkg/pcloud-rs-*-macos-*.pkg
            target/pkg/SHA256SUMS.macos.txt

      - name: Attach signed macOS installer to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            target/pkg/pcloud-rs-*-macos-*.pkg \
            target/pkg/SHA256SUMS.macos.txt \
            --clobber
