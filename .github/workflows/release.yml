name: Release

# Triggered on version tags (v*) or manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Build release artifacts ──────────────────────────────────────────────
  build-artifacts:
    name: Build release artifacts (Linux x86_64)
    runs-on: ubuntu-latest
    outputs:
      daemon-path: target/release/pcloudd
      cli-path: target/release/pcloudc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get install -y fuse3 libfuse3-dev

      - name: Build with cargo-auditable
        # cargo-auditable embeds a dependency manifest inside the binary
        # (pcloud-rs-s1p.55 / FIX-PLAN P2-7 H-4).
        # Both pcloudd (daemon) and pcloudc (CLI) are shipped: the nfpm
        # Debian/RPM manifest (packaging/debian/nfpm.yaml:65-72) places both
        # under /usr/bin, and end users need the CLI to drive the daemon.
        # (pcloud-rs-ncx.26 / audit-06 P2-12)
        run: |
          cargo install cargo-auditable --locked
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          cargo auditable build --release -p pcloud-daemon -p pcloud-cli

      - name: Compute SHA-256 digests
        run: |
          sha256sum target/release/pcloudd > target/release/pcloudd.sha256
          sha256sum target/release/pcloudc > target/release/pcloudc.sha256
          cat target/release/pcloudd.sha256
          cat target/release/pcloudc.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: |
            target/release/pcloudd
            target/release/pcloudd.sha256
            target/release/pcloudc
            target/release/pcloudc.sha256

  # ── SBOM generation ─────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM (syft)
    runs-on: ubuntu-latest
    needs: build-artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-binary
          path: dist/

      - name: Install syft
        # syft produces a CycloneDX / SPDX SBOM from the binary + Cargo.lock.
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (CycloneDX JSON)
        # Syft is invoked against the daemon binary; both pcloudd and
        # pcloudc are built from the same Cargo.lock so the dependency
        # inventory is identical. The SBOM therefore covers both binaries.
        run: |
          syft dist/pcloudd \
            --source-name pcloud-rs \
            --source-version "${GITHUB_REF_NAME:-dev}" \
            -o cyclonedx-json=dist/pcloud-rs.sbom.cdx.json \
            -o spdx-json=dist/pcloud-rs.sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            dist/pcloud-rs.sbom.cdx.json
            dist/pcloud-rs.sbom.spdx.json

  # ── cosign signing ───────────────────────────────────────────────────────
  sign:
    name: Sign release artifacts (cosign)
    runs-on: ubuntu-latest
    needs: [build-artifacts, sbom]
    # Signing strategy (in priority order):
    #   1. Keyless Sigstore OIDC (preferred on tag pushes — no secrets required).
    #      Requires id-token: write permission (granted below).
    #      Produces a transparency-log entry on https://rekor.sigstore.dev.
    #   2. Key-based fallback: set COSIGN_KEY + COSIGN_PASSWORD repository
    #      secrets for offline signing without a Sigstore log entry.
    permissions:
      contents: read
      id-token: write   # required for Sigstore keyless OIDC signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-binary
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: dist/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binary and SBOM with cosign
        # Keyless path: when COSIGN_KEY secret is absent (the default for this
        # repo), sign with Sigstore OIDC — no key management required on GitHub
        # Actions. The --yes flag suppresses the interactive confirmation prompt.
        #
        # Key-based fallback: if COSIGN_KEY is set as a repository secret,
        # use it for offline signing (no transparency log entry).
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for artifact in dist/pcloudd dist/pcloudc dist/pcloud-rs.sbom.cdx.json dist/pcloud-rs.sbom.spdx.json; do
            if [ -f "$artifact" ]; then
              if [ -n "${COSIGN_KEY}" ]; then
                # Key-based fallback path.
                echo "${COSIGN_KEY}" > /tmp/cosign.key
                cosign sign-blob \
                  --key /tmp/cosign.key \
                  --output-signature "${artifact}.sig" \
                  "${artifact}"
                rm -f /tmp/cosign.key
              else
                # Keyless Sigstore OIDC path (default).
                cosign sign-blob \
                  --yes \
                  --rekor-url https://rekor.sigstore.dev \
                  --output-signature "${artifact}.sig" \
                  "${artifact}"
              fi
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: dist/*.sig
        if: always()

  # ── GitHub Release attachment ────────────────────────────────────────────
  publish:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-artifacts, sbom, sign]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist/

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pcloudd
            dist/pcloudd.sha256
            dist/pcloudc
            dist/pcloudc.sha256
            dist/pcloud-rs.sbom.cdx.json
            dist/pcloud-rs.sbom.spdx.json
            dist/*.sig
