name: Security audit

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday
  push:
    paths: ['**/Cargo.lock', '**/Cargo.toml']

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
