name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:
  schedule:
    # Weekly live-e2e window: Sunday 02:00 UTC.
    # Only the live-e2e job uses the schedule trigger; all other jobs
    # run only on push/pull_request.
    - cron: '0 2 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system deps (FUSE)
        run: sudo apt-get install -y fuse3 libfuse3-dev
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo test (workspace minus mount-requiring pcloud-fs tests)
        run: cargo test --workspace --exclude pcloud-fs
      - name: cargo test pcloud-fs (unit + mock-backend integration tests, no real FUSE mount)
        # Runs #[test] functions that do not require fuse-t or a real mount.
        # fuse-t is not available in GitHub-hosted macOS runners.
        # --lib covers in-src unit tests; the three integration test files
        # (fuse_adapter_unit, write_path_unit, inode_unit) use mock backends
        # and do not touch the kernel, so they are safe on macOS runners.
        run: |
          cargo test -p pcloud-fs --lib
          cargo test -p pcloud-fs --test fuse_adapter_unit
          cargo test -p pcloud-fs --test inode_unit
          cargo test -p pcloud-fs --test write_path_unit

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo test (no-FUSE)
        run: cargo test --workspace --exclude pcloud-fs

  # FreeBSD CI — exercises pcloud-fs/src/platform/bsd.rs.
  # FreeBSD is Tier-3 best-effort (community hardware, vmactions flakiness).
  # continue-on-error is intentionally set; README documents FreeBSD as
  # "Tier-3 community best-effort" — not Tier-1. Do NOT remove
  # continue-on-error without simultaneously promoting FreeBSD to Tier-1 in
  # all docs AND removing the Tier-3 disclaimer.
  freebsd:
    name: Test (FreeBSD / Tier-3 best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true  # Tier-3: vmactions/freebsd-vm is flaky on GH runners
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust fusefs-libs pkgconf
          run: |
            cargo check --workspace
            cargo test --workspace --exclude pcloud-fs

  build-release:
    name: Release build (Linux)
    runs-on: ubuntu-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get install -y fuse3 libfuse3-dev
      - name: cargo build --release
        run: cargo build --release --workspace

  # Reproducible-build gate (pcloud-rs-s1p.54 / FIX-PLAN P2-7 H-3)
  # Builds the release binary on two independent ubuntu-latest runners and
  # compares SHA-256 digests. Fails if the digests differ.
  reproducible-build:
    name: Reproducible build check
    runs-on: ubuntu-latest
    needs: test-linux
    strategy:
      matrix:
        runner-slot: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get install -y fuse3 libfuse3-dev
      - name: Build release binary
        run: |
          # SOURCE_DATE_EPOCH pins embedded timestamps for reproducibility.
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          cargo build --release -p pcloud-daemon
      - name: Upload binary digest
        run: |
          sha256sum target/release/pcloudd > digest-${{ matrix.runner-slot }}.txt
          cat digest-${{ matrix.runner-slot }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: repro-digest-${{ matrix.runner-slot }}
          path: digest-${{ matrix.runner-slot }}.txt

  reproducible-build-compare:
    name: Compare reproducible-build digests
    runs-on: ubuntu-latest
    needs: reproducible-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: repro-digest-*
          merge-multiple: true
      - name: Compare digests (fail on mismatch)
        run: |
          DIGEST_A=$(awk '{print $1}' digest-a.txt)
          DIGEST_B=$(awk '{print $1}' digest-b.txt)
          echo "Runner A: $DIGEST_A"
          echo "Runner B: $DIGEST_B"
          if [ "$DIGEST_A" != "$DIGEST_B" ]; then
            echo "FAIL: reproducible-build mismatch — binaries differ between runners"
            exit 1
          fi
          echo "OK: reproducible build verified"

  # Optional-feature build check (audit-06 wave-G8 H-06).
  #
  # CI previously ran only default-feature clippy/test, so enterprise-only
  # feature combinations (KMS, metrics, OTLP tracing, IDP insecure-test)
  # could rot unnoticed. This job compiles each significant non-default
  # feature set to catch breakage early. It does NOT run tests — optional
  # features may require runtime services (OTLP collector, KMS endpoint)
  # that are unavailable on ephemeral runners.
  #
  # Intentionally excluded features:
  #   - pcloud-config: fips-preview — compile-error by design (not yet
  #     implemented); listed in Cargo.toml as a future placeholder only.
  optional-features:
    name: Optional feature builds
    runs-on: ubuntu-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (FUSE)
        run: sudo apt-get install -y fuse3 libfuse3-dev
      # pcloud-config: KMS factory (links against pcloud-kms and pcloud-secret)
      - name: cargo check pcloud-config --features kms-factory
        run: cargo check -p pcloud-config --features kms-factory
      # pcloud-config: AWS KMS provider pass-through
      - name: cargo check pcloud-config --features aws-kms
        run: cargo check -p pcloud-config --features aws-kms
      # pcloud-daemon: Prometheus metrics exporter
      - name: cargo check pcloud-daemon --features metrics
        run: cargo check -p pcloud-daemon --features metrics
      # pcloud-daemon: structured JSON logs
      - name: cargo check pcloud-daemon --features json-logs
        run: cargo check -p pcloud-daemon --features json-logs
      # pcloud-daemon: OpenTelemetry distributed tracing
      - name: cargo check pcloud-daemon --features tracing-otlp
        run: cargo check -p pcloud-daemon --features tracing-otlp
      # pcloud-observability: Prometheus exporter feature
      - name: cargo check pcloud-observability --features prometheus-exporter
        run: cargo check -p pcloud-observability --features prometheus-exporter
      # pcloud-observability: OTLP exporter feature
      - name: cargo check pcloud-observability --features tracing-otlp
        run: cargo check -p pcloud-observability --features tracing-otlp

  # mdbook build gate (pcloud-rs-s1p.75 / FIX-PLAN P2-7 MED / §12-opus L-4)
  # Ensures every chapter in docs/book compiles successfully.
  mdbook:
    name: mdbook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook
        run: |
          cargo install mdbook --no-default-features --locked 2>/dev/null || \
          (curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin)
      - name: Build docs/book
        run: mdbook build docs/book

  # cargo doc gate (pcloud-rs-8mb.39 / §11-12-sonnet L-3)
  # Fails on any rustdoc warning so public API documentation stays accurate.
  cargo-doc:
    name: cargo doc (no warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (FUSE)
        run: sudo apt-get install -y fuse3 libfuse3-dev
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

  # CHANGELOG release-gate (pcloud-rs-8mb.39 / §11-12-sonnet L-2,
  # strengthened audit-06 wave-2 bd-pcloud-rs-ncx.78).
  # On a tag push, verify that CHANGELOG.md has been bumped from [Unreleased]
  # to a versioned heading matching the tag AND that the versioned section
  # contains at least one bullet (i.e. the entry is not empty).
  changelog-gate:
    name: CHANGELOG release gate
    runs-on: ubuntu-latest
    # Only relevant on tag pushes; skip for branch pushes and PRs.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Verify CHANGELOG has a non-empty versioned entry for this tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Strip leading 'v' so v0.1.0 matches [0.1.0].
          VERSION="${TAG#v}"
          echo "Checking CHANGELOG.md for [${VERSION}] entry..."
          if ! grep -qE "^\#\# \[${VERSION}\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md does not contain a versioned heading for [${VERSION}]."
            echo "       Bump the [Unreleased] section to [${VERSION}] - $(date +%Y-%m-%d) before tagging."
            exit 1
          fi
          echo "OK: [${VERSION}] heading found in CHANGELOG.md."

          # audit-06 wave-2 bd-pcloud-rs-ncx.78: the previous gate passed
          # as long as the heading existed. A release tag against a stale
          # or empty `## [X.Y.Z]` section was accepted silently. Walk from
          # the versioned heading to the next `## [` heading (or EOF) and
          # require at least one bullet (`^- `, `^* `, or `^+ `). Subsection
          # headings (`### Added`, `### Changed`, …) alone are not enough;
          # a human-readable bullet must exist.
          echo "Verifying [${VERSION}] section is non-empty..."
          # Use string-prefix comparison (`index($0, prefix) == 1`) rather
          # than a regex so `[` / `]` in the version heading are treated
          # as literal characters without regex escaping.
          START_PREFIX="## [${VERSION}]"
          SECTION_LABEL="[${VERSION}]"
          awk \
            -v start_prefix="${START_PREFIX}" \
            -v section_label="${SECTION_LABEL}" '
            BEGIN { in_section = 0; bullet_count = 0; subsection_count = 0 }
            index($0, start_prefix) == 1 { in_section = 1; next }
            in_section && index($0, "## [") == 1 { exit 0 }
            in_section && index($0, "### ") == 1 { subsection_count++; next }
            in_section && /^[[:space:]]*[-*+] / { bullet_count++ }
            END {
              if (!in_section) {
                print "ERROR: could not locate " section_label " section body in CHANGELOG.md" > "/dev/stderr"
                exit 2
              }
              if (bullet_count == 0) {
                print "ERROR: " section_label " section in CHANGELOG.md has no bullets." > "/dev/stderr"
                print "       Add at least one ### Added / Changed / Fixed / Security" > "/dev/stderr"
                print "       bullet before tagging the release." > "/dev/stderr"
                exit 3
              }
              printf "OK: %s section has %d bullet(s) across %d subsection(s).\n", section_label, bullet_count, subsection_count
            }
          ' CHANGELOG.md

          # Belt-and-braces: also confirm an [Unreleased] section still
          # exists at the top of the file (so the next cycle has a place
          # to accumulate entries). A missing [Unreleased] is not a hard
          # error — Keep-a-Changelog allows omitting it — but emit a
          # visible warning so we notice if someone removes it by
          # accident.
          if ! grep -qE "^\#\# \[Unreleased\]" CHANGELOG.md; then
            echo "WARNING: no [Unreleased] section at top of CHANGELOG.md."
            echo "         The next tagged release must re-add one."
          fi

  # Live end-to-end test suite (pcloud-rs FIX-PLAN §9-10 H4).
  #
  # IMPORTANT: This job runs against a real pCloud account. It must NOT
  # run on every PR push — it is gated to workflow_dispatch and the
  # weekly schedule only. Secrets (PCLOUD_TEST_USER, PCLOUD_TEST_PASSWORD)
  # must be configured in the repository secret store by an admin.
  #
  # continue-on-error is set intentionally while account stability and
  # test isolation are being established. Remove it once the live-e2e
  # suite has run cleanly for at least four consecutive weekly windows.
  live-e2e:
    name: Live E2E (weekly / manual)
    runs-on: ubuntu-latest
    # Only run on workflow_dispatch or the weekly schedule; never on PR.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true  # Provisional: remove once suite is stable (≥4 green weekly runs).
    env:
      PCLOUD_LIVE_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (FUSE)
        run: sudo apt-get install -y fuse3 libfuse3-dev
      - name: Run live E2E tests (ignored tests, single-threaded)
        env:
          PCLOUD_TEST_USER: ${{ secrets.PCLOUD_TEST_USER }}
          PCLOUD_TEST_PASSWORD: ${{ secrets.PCLOUD_TEST_PASSWORD }}
        run: |
          cargo test -p pcloud-live-e2e -- --ignored --test-threads=1
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-logs-${{ github.run_id }}
          # Upload logs only — no secrets are written to files by the test suite.
          path: |
            target/debug/build/**/output
            /tmp/pcloud-live-e2e-*
          retention-days: 7

  # Coverage (pcloud-rs-ujp item d).
  #
  # Runs `cargo llvm-cov` to produce a line-coverage report for the
  # workspace. The job is INTENTIONALLY non-gating (continue-on-error:
  # true) because we do not yet have a project-agreed coverage
  # threshold. A hard gate needs infrastructure decisions that sit
  # above a fix-agent's pay grade:
  #
  #   - which crates to exclude (fuzz targets, live-e2e scaffolding,
  #     platform-gated code that CI cannot exercise);
  #   - the baseline threshold (30%? 60%? 85%?) and who signs off on
  #     regressions;
  #   - whether to track the metric per-crate, per-module, or
  #     workspace-wide;
  #   - whether to publish reports to a service (Codecov, Coveralls)
  #     or keep artifacts in-repo only.
  #
  # Until those decisions land, the job publishes an informational
  # report as a build artifact so humans can spot-check trends. Flip
  # `continue-on-error` to false and add `--fail-under-lines=<N>`
  # once the policy is agreed.
  #
  # Scheduled only (weekly + manual dispatch) so the normal fast-path
  # CI stays quick.
  coverage:
    name: Coverage (weekly / manual, advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true  # Advisory; see job comment for the infra-decision list.
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Install system deps (FUSE)
        run: sudo apt-get install -y fuse3 libfuse3-dev
      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info \
            --ignore-filename-regex '(live_e2e|fuzz|benches)' || true
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            lcov.info
            coverage-summary.txt
          retention-days: 30

  # macOS live FUSE tests (pcloud-rs-ujp item f).
  #
  # DEFERRED: requires a macOS runner with `fuse-t` pre-installed.
  # GitHub-hosted macOS runners do NOT have fuse-t (and cannot install
  # it without a kernel-adjacent step requiring sudo + a signed kext/
  # system extension workflow that SIP rejects in ephemeral runners).
  #
  # Closure paths:
  #   1. Provision a self-hosted macOS runner with fuse-t pre-baked.
  #   2. Use macOS runners with a community fuse-t action once one
  #      exists that is production-trustworthy.
  #   3. Accept Tier-2 hardware-only verification and never run these
  #      in CI (documented in README).
  #
  # This is an infrastructure / budget decision; no CI job is landed
  # here on purpose. Local reproducer:
  #
  #   PCLOUD_LIVE_E2E=1 PCLOUD_FUSE_TEST=1 \
  #     cargo test -p pcloud-fs --test fuse_write_path_live \
  #     -- --ignored --test-threads=1
  #
  # Tracking: pcloud-rs-ujp (item f).

  # Chaos / fault-injection tests (pcloud-rs-ujp item g).
  #
  # DEFERRED: the chaos suite (disk_full_journal, slowloris_timeout,
  # sigkill_mid_flush) is gated on `PCLOUD_CHAOS=1`. Moving it into
  # a weekly CI job is straightforward mechanically, but the suite
  # currently produces load-dependent timings that make it flaky on
  # GitHub shared runners. Enabling it before the flakiness is
  # stabilized would bury real regressions under noise.
  #
  # Closure paths:
  #   1. Stabilize each chaos test's timing budget against
  #      ubuntu-latest's jittery scheduler.
  #   2. Land a separate `chaos` workflow on a self-hosted runner with
  #      a pinned CPU budget.
  #   3. Accept that chaos stays developer-run-only and document the
  #      invocation in OPERATIONS-RUNBOOK.md (currently done).
  #
  # Local reproducer:
  #
  #   PCLOUD_CHAOS=1 cargo test --workspace -- --ignored
  #
  # Tracking: pcloud-rs-ujp (item g).

  # IPC stress test (audit-06 wave-2, bd-pcloud-rs-ncx.75).
  #
  # `crates/pcloud-ipc/tests/stress_concurrent_clients.rs` exercises
  # 50 clients × 500 sequential requests against an owner-only Unix-
  # socket server. It catches fd leaks and connection-cap regressions
  # — security-critical — but it is `#[ignore]`-gated because it
  # takes ~30-60 s of wall time. Run it on the weekly schedule and on
  # manual dispatch; skip on every push/PR so the normal CI fast-
  # path stays quick.
  ipc-stress:
    name: IPC stress (weekly / manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run IPC stress test (50 clients x 500 reqs)
        run: |
          cargo test --release -p pcloud-ipc \
            --test stress_concurrent_clients \
            -- --ignored --test-threads=1 --nocapture
