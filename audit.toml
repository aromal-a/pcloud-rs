# cargo-audit configuration for the pcloud-rs Rust rewrite workspace.
#
# Advisories listed under [advisories.ignore] are time-boxed exceptions and
# MUST mirror deny.toml. Every entry carries a `review: YYYY-MM-DD`
# comment; the nightly `deny-audit` CI job is expected to re-flag anything
# whose upstream has shipped a patched release so the reviewer can drop it.

[advisories]
ignore = [
    # RUSTSEC-2021-0119: nix 0.19.1 (transitive via `battery v0.7.8`) —
    # macOS/Windows-only target graph. See deny.toml for detail.
    # review: 2026-07-15
    "RUSTSEC-2021-0119",
    # RUSTSEC-2026-0097: rand unsound with custom logger (reqwest/AWS stack).
    # review: 2026-07-15
    "RUSTSEC-2026-0097",
    # RUSTSEC-2025-0134: rustls-pemfile unmaintained (AWS transitive).
    # review: 2026-07-15
    "RUSTSEC-2025-0134",
    # RUSTSEC-2026-0098: rustls name-constraints for URIs (upstream patching).
    # review: 2026-06-01
    "RUSTSEC-2026-0098",
    # RUSTSEC-2026-0099: rustls name-constraints wildcard (upstream patching).
    # review: 2026-06-01
    "RUSTSEC-2026-0099",
]

# Fail the build on any advisory other than the explicitly ignored set.
severity-threshold = "none"
