# cargo-audit configuration for the pcloud-rs Rust rewrite workspace.
#
# Advisories listed under [advisories.ignore] are time-boxed exceptions.
# cargo-audit 0.22 does not read this file automatically; the GitHub
# workflows pass the same IDs with explicit `--ignore` flags. Keep both
# surfaces in sync. Every entry carries a `review: YYYY-MM-DD` comment.

[advisories]
ignore = [
    # RUSTSEC-2023-0071: the workspace is pinned to rsa 0.10.0-rc.18, whose
    # private-key arithmetic uses crypto-bigint, but RustSec still applies the
    # family-wide advisory. Upstream reports no patched version. Retain the
    # exception only while RSA-OAEP unwrap remains a local, bounded pCloud
    # Crypto compatibility operation rather than a remotely measurable oracle.
    # Replace the implementation as soon as a constant-time interoperable
    # backend is available.
    # review: 2026-07-15
    "RUSTSEC-2023-0071",
]

# Fail the build on any advisory other than the explicitly ignored set.
severity-threshold = "none"
